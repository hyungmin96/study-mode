<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1c1b1a;--sub:#6b6862;--line:#e6e3dc;--acc:#2f6fed;--accbg:#e9f0fe;--hook:#fff6e0;--hookb:#f0cf7a;--side:#efede8;--vhd:#2d3b5e;--vlab:#e8ecf4;--vz:#f5f7fb;--vln:#b6bfd3}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1e;--ink:#ecebe8;--sub:#a29e96;--line:#34322f;--acc:#7aa7ff;--accbg:#1f2a40;--hook:#2e2814;--hookb:#6d5a1f;--side:#1c1b1a;--vhd:#33477a;--vlab:#26303f;--vz:#1d2330;--vln:#3b455a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 12px 40px}
aside .name{font-weight:700;font-size:1rem;padding:0 8px;margin-bottom:2px}
aside .key{padding:0 8px;margin-bottom:14px;font-size:.75rem;color:var(--sub)}
aside .key code{background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
details.rq{margin:2px 0}
details.rq>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:.88rem;font-weight:600;line-height:1.35}
details.rq>summary::-webkit-details-marker{display:none}
details.rq>summary::before{content:"▸";color:var(--sub);font-size:.75rem;margin-top:2px;transition:transform .15s}
details.rq[open]>summary::before{transform:rotate(90deg)}
details.rq>summary:hover{background:var(--accbg)}
.qn{flex:none;color:#fff;background:var(--acc);border-radius:5px;padding:0 6px;font-size:.72rem;margin-top:1px}
.qt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{margin:2px 0 6px 20px;border-left:1px solid var(--line)}
.sub a{display:block;padding:4px 10px;font-size:.82rem;color:var(--sub);text-decoration:none;border-radius:0 6px 6px 0}
.sub a:hover{color:var(--acc);background:var(--accbg)}
aside a.on,details.rq.on>summary{color:var(--acc);background:var(--accbg)}
.sub a.on{font-weight:600;box-shadow:inset 2px 0 0 var(--acc)}
.menu-btn{display:none}
main{max-width:860px;width:100%;margin:0 auto;padding:28px 20px 90px}
main>h1{margin:0 0 6px;font-size:1.7rem}
.round{margin-top:56px;scroll-margin-top:16px}
.round:first-of-type{margin-top:28px}
.q{font-size:1.5rem;line-height:1.4;margin:0 0 18px;padding:14px 18px;background:var(--accbg);border-left:6px solid var(--acc);border-radius:10px;display:flex;gap:12px;align-items:baseline}
.q span{flex:none;color:#fff;background:var(--acc);border-radius:8px;padding:2px 12px;font-size:1.05rem;font-weight:800}
.chunk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;scroll-margin-top:16px}
.chunk h2{font-size:1.1rem;margin:0 0 6px}
.gist{margin:0 0 8px;font-weight:600}
.chunk ul{margin:6px 0 10px;padding-left:20px}
.chunk li{margin:3px 0}
.hook{margin:8px 0 0;padding:8px 12px;background:var(--hook);border-left:3px solid var(--hookb);border-radius:6px;font-size:.92rem}
.viz{margin:12px 0 14px}
.viz figcaption{font-size:.85rem;font-weight:700;color:var(--sub);margin:0 0 6px}
.viz>svg{width:100%;height:auto;display:block}
.viz pre.mermaid svg{max-width:none;height:auto}
.viz:not(.diagram) text{font-family:inherit;font-size:14px}
.viz .hd{fill:var(--vhd)}.viz .hdt{fill:#fff;font-weight:700}
.viz .lab{fill:var(--vlab)}.viz .labt{fill:var(--ink);font-weight:700}
.viz .c0{fill:var(--card)}.viz .c1{fill:var(--vz)}.viz .ct{fill:var(--ink)}
.viz .ln{stroke:var(--vln);stroke-width:1}.viz .bd{fill:none;stroke:var(--vln);stroke-width:1}
.viz.diagram{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.viz pre.mermaid{margin:0;background:none;padding:0;text-align:center;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--sub)}
.viz pre.mermaid[data-processed]{color:inherit}
.viz pre.mermaid svg{margin:0 auto}
.viz pre.mermaid.wide::after{content:"← 옆으로 밀어서 보기 →";display:block;margin-top:4px;font:.75rem/1.4 -apple-system,sans-serif;color:var(--sub)}
.viz pre.mermaid{overflow-x:auto}
.legend{margin:4px 0 10px;padding:8px 12px 8px 28px;border:1px dashed var(--line);border-radius:8px;font-size:.88rem}
.legend li{margin:2px 0}
.legend strong{color:var(--acc)}
details.legend-all{margin:4px 0 10px;font-size:.85rem}
details.legend-all>summary{cursor:pointer;color:var(--sub);list-style:none;display:inline-block;padding:2px 0}
details.legend-all>summary::-webkit-details-marker{display:none}
details.legend-all>summary::before{content:"▸ ";font-size:.75rem}
details.legend-all[open]>summary::before{content:"▾ "}
details.legend-all .legend{margin-top:4px}
.tip-hint{font-size:.75rem;color:var(--sub);margin:6px 0 0;text-align:right}
.viz pre.mermaid .tip{cursor:pointer}
.viz pre.mermaid .tip:hover{filter:brightness(1.35)}
.viz pre.mermaid .tip.on{filter:drop-shadow(0 0 4px var(--acc))}
.memo{position:absolute;z-index:30;max-width:300px;padding:10px 12px 10px 14px;background:var(--hook);border:1px solid var(--hookb);border-left:4px solid var(--hookb);border-radius:8px;box-shadow:0 6px 20px #0005;font-size:.86rem;line-height:1.5;color:var(--ink)}
.memo b{display:block;margin-bottom:2px;color:var(--acc)}
.memo .x{position:absolute;top:2px;right:7px;border:0;background:none;color:var(--sub);font-size:1rem;cursor:pointer;padding:2px}
.ask{margin:6px 0 12px;padding:8px 12px;background:var(--accbg);border-left:3px solid var(--acc);border-radius:6px;font-size:.92rem}
.ask::before{content:"설명해 보기 · ";font-weight:700;color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0 10px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--bg)}
code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:4px}
@media(max-width:820px){
  .layout{display:block}
  .menu-btn{display:block;position:fixed;right:14px;bottom:14px;z-index:20;border:0;border-radius:999px;background:var(--acc);color:#fff;font-size:.9rem;padding:11px 18px;box-shadow:0 3px 12px #0004}
  aside{position:fixed;inset:0 20% 0 0;height:auto;z-index:15;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 18px #0004}
  body.open aside{transform:none}
}
</style>
</head>
<body>
<div class="layout">
<aside id="side">
  <div class="name">{{TITLE}}</div>
  <div class="key">이어서 질문: <code>/study-mode {{KEY}} &lt;질문&gt;</code></div>
  <div id="toc"></div>
</aside>
<main>
<h1>{{TITLE}}</h1>
<!--ROUNDS-->
</main>
</div>
<button class="menu-btn" id="mb" type="button">☰ 목차</button>
<script src="../vendor/mermaid.min.js"></script>
<script>
/* 다이어그램: 로컬 mermaid.min.js로 렌더링. 파일이 없으면 Mermaid 코드가 글자로 남는다 */
if(window.mermaid&&document.querySelector('pre.mermaid')){
  var dk=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  /* 화살표 라벨: 상자는 넉넉하게, 글자는 노드보다 살짝 작게. 배경은 카드 색에 맞춘다 */
  var lb=dk?'#2b2a28':'#f1efea',lt=dk?'#d9d6d0':'#3a3833',lbd=dk?'#5c5a55':'#d8d4cb';
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:dk?'dark':'neutral',
    fontFamily:'-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif',
    themeVariables:{edgeLabelBackground:lb},
    flowchart:{useMaxWidth:false,padding:12,nodeSpacing:40,rankSpacing:56},
    state:{useMaxWidth:false},
    themeCSS:'.edgeLabel,.edgeLabel rect,.edgeLabel .labelBkg{background-color:transparent!important;fill:transparent!important}'+
      '.edgeLabel span.edgeLabel{display:inline-block;padding:4px 10px;border-radius:5px;'+
      'border:1px solid '+lbd+';background-color:'+lb+';color:'+lt+'}'+
      '.edgeLabel p,.edgeLabel span{font-size:12px;line-height:1.3;margin:0}'});
  mermaid.run({querySelector:'pre.mermaid',suppressErrors:true}).then(function(){
    /* 라벨 없는 화살표에 생긴 빈 상자 숨기기 */
    [].forEach.call(document.querySelectorAll('pre.mermaid .edgeLabel'),function(e){
      if(!e.textContent.trim())e.style.display='none'});
    /* 폭보다 넓은 그림: 70% 이상으로 줄여서 맞으면 줄이고, 아니면 원래 크기로 두고 가로 스크롤 안내 */
    [].forEach.call(document.querySelectorAll('pre.mermaid svg'),function(s){
      var p=s.parentNode,w=s.viewBox&&s.viewBox.baseVal&&s.viewBox.baseVal.width||s.getBoundingClientRect().width,c=p.clientWidth;
      if(!w||w<=c)return;
      if(c/w>=0.7)s.style.maxWidth='100%';else p.classList.add('wide');
    });
    tips();
  });
}

/* 그림 속 단어를 누르면 요소 설명 목록(ul.legend)의 해당 설명을 메모로 띄운다.
   목록은 "설명 전체 보기"로 접는다. 스크립트가 안 돌면 목록이 그대로 보인다. */
function tips(){
  var norm=function(s){return (s||'').toLowerCase().replace(/[\s"'“”()·:?]/g,'')};
  var memo=null,cur=null;
  function close(){if(memo){memo.remove();memo=null}if(cur){cur.classList.remove('on');cur=null}}
  function open(el,name,desc){
    if(cur===el){close();return}
    close();cur=el;el.classList.add('on');
    memo=document.createElement('div');memo.className='memo';memo.setAttribute('role','note');
    var b=document.createElement('b');b.textContent=name;
    var x=document.createElement('button');x.className='x';x.type='button';x.textContent='×';x.setAttribute('aria-label','닫기');
    x.addEventListener('click',function(e){e.stopPropagation();close()});
    memo.appendChild(x);memo.appendChild(b);memo.appendChild(document.createTextNode(desc));
    document.body.appendChild(memo);
    var r=el.getBoundingClientRect(),mw=memo.offsetWidth,mh=memo.offsetHeight,vw=document.documentElement.clientWidth;
    var left=Math.min(Math.max(8,r.left+r.width/2-mw/2),vw-mw-8),top=r.bottom+8;
    if(top+mh>window.innerHeight&&r.top-mh-8>0)top=r.top-mh-8;
    memo.style.left=(left+window.scrollX)+'px';memo.style.top=(top+window.scrollY)+'px';
  }
  document.addEventListener('click',function(e){if(memo&&!memo.contains(e.target))close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  window.addEventListener('resize',close);

  [].forEach.call(document.querySelectorAll('figure.diagram'),function(fig){
    var ul=fig.nextElementSibling;
    if(!ul||!ul.matches('ul.legend'))return;
    var items=[];
    [].forEach.call(ul.querySelectorAll('li'),function(li){
      var s=li.querySelector('strong');if(!s)return;
      var name=s.textContent.trim(),desc=li.textContent.replace(s.textContent,'').replace(/^\s*[:：\-–]\s*/,'').trim();
      /* 별칭: 원래 이름, "Survivor 0 / 1" → Survivor 0, Survivor 1, "A와 B"·"A·B" → A, B */
      var al=[name],m=name.match(/^(.*?)(\S+)\s*\/\s*(\S+)$/);
      if(m)al.push(m[1]+m[2],m[1]+m[3]);
      name.split(/\s*(?:\/|·|,|와|과|및)\s*/).forEach(function(p){if(p.length>1)al.push(p)});
      items.push({name:name,desc:desc,al:al.map(norm).filter(function(a){return a.length>1})});
    });
    if(!items.length)return;
    var svg=fig.querySelector('svg');if(!svg)return;
    var hit=0,seen=[];
    svg.querySelectorAll('g.node, g.edgeLabel, g.cluster, text.actor, text.messageText, g.statediagram-state, text.noteText')
      .forEach(function(el){
        var label=el.matches('g.cluster')?el.querySelector('.cluster-label, .nodeLabel, text'):el;
        if(!label)return;
        var t=norm(label.textContent);if(!t)return;
        var best=null,score=0;
        items.forEach(function(it){it.al.forEach(function(a){
          /* 정확히 같으면 우선, 포함이면 이름이 라벨 글자의 40% 이상일 때만 ("유효하면 응답"이 "응답"에 붙지 않게) */
          var sc=t===a?1000+a.length:(t.indexOf(a)>=0&&a.length/t.length>=0.4?a.length:0);
          if(sc>score){score=sc;best=it}})});
        if(!best)return;
        var target=el.matches('text.actor')&&el.parentNode.tagName.toLowerCase()==='g'?el.parentNode:(el.matches('g.cluster')?label:el);
        if(seen.indexOf(target)>=0)return;seen.push(target);
        target.classList.add('tip');target.setAttribute('tabindex','0');target.setAttribute('role','button');
        var go=function(e){e.stopPropagation();open(target,best.name,best.desc)};
        target.addEventListener('click',go);
        target.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}});
        hit++;
      });
    if(!hit)return;
    var hint=document.createElement('p');hint.className='tip-hint';hint.textContent='그림 속 단어를 누르면 설명이 나와요';
    fig.appendChild(hint);
    var d=document.createElement('details');d.className='legend-all';
    var sm=document.createElement('summary');sm.textContent='설명 전체 보기 ('+items.length+')';
    ul.parentNode.insertBefore(d,ul);d.appendChild(sm);d.appendChild(ul);
  });
}
</script>
<script>
(function(){
  var toc=document.getElementById('toc'),rounds=[].slice.call(document.querySelectorAll('.round')),links=[],groups=[];
  rounds.forEach(function(r,i){
    var qEl=r.querySelector('.q'),qn=qEl.querySelector('span').textContent,qt=qEl.textContent.replace(qn,'').trim();
    var d=document.createElement('details');d.className='rq';if(i===rounds.length-1)d.open=true;
    var s=document.createElement('summary');
    s.innerHTML='<span class="qn"></span><span class="qt"></span>';
    s.firstChild.textContent=qn;s.lastChild.textContent=qt;
    s.addEventListener('click',function(){location.hash=r.id});
    d.appendChild(s);
    var sub=document.createElement('div');sub.className='sub';
    [].slice.call(r.querySelectorAll('.chunk')).forEach(function(c,j){
      c.id=r.id+'-c'+(j+1);
      var a=document.createElement('a');a.href='#'+c.id;a.textContent=c.getAttribute('data-title')||c.querySelector('h2').textContent;
      a.addEventListener('click',function(){document.body.classList.remove('open')});
      sub.appendChild(a);links.push({a:a,el:c,d:d});
    });
    d.appendChild(sub);toc.appendChild(d);groups.push({d:d,el:r});
  });
  var all=links.concat(groups.map(function(g){return{a:null,el:g.el,d:g.d}}));
  function spy(){
    var y=window.scrollY+80,cur=null;
    links.forEach(function(l){if(l.el.offsetTop<=y)cur=l});
    links.forEach(function(l){l.a.classList.toggle('on',l===cur)});
    groups.forEach(function(g){g.d.classList.toggle('on',!!cur&&cur.d===g.d)});
    if(cur&&!cur.d.open)cur.d.open=true;
  }
  window.addEventListener('scroll',spy,{passive:true});spy();
  document.getElementById('mb').addEventListener('click',function(){document.body.classList.toggle('open')});
})();
</script>
</body>
</html>
